<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .estrelas-container {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 4px;
            margin: 8px 0;
        }

        .estrelas-container input[type="radio"] {
            display: none;
        }

        .estrelas-container label {
            font-size: 2rem;
            color: #ccc;
            cursor: pointer;
            transition: color 0.15s ease, transform 0.1s ease;
        }

        .estrelas-container input[type="radio"]:checked ~ label,
        .estrelas-container label:hover,
        .estrelas-container label:hover ~ label {
            color: #f5a623;
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- Cabeçalho de navegação do site -->
    <header class="cabecalho">
        <a href="home.html" class="nav-logo">Entre Notas</a>
        <a href="sobre.html" class="nav-sobre">Sobre</a>
        <nav class="cabecalho-menu">
            <a href="home.html" class="nav-item">
                <span class="icon">🏠</span> Feed
            </a>
            <a href="avaliar.html" class="nav-item active">
                <span class="icon">⭐</span> Avaliar
            </a>
            <a href="perfil.html" class="nav-item">
                <span class="icon">👤</span> Perfil
            </a>
        </nav>
    </header>

    <!-- Conteúdo principal do formulário -->
    <main id="home-container">
        <!-- O formulário agora utiliza a classe card-avaliacao para herdar todo o estilo visual -->
        <section class="card-avaliacao">
            <h2 style="color: var(--primary-color); margin-top: 0; font-size: 1.5rem;">Avaliar Música</h2>
            <p style="margin-bottom: 20px; color: #8b88a0;">Compartilhe sua opinião musical</p>

            <form id="formAvaliacao">
                <div class="busca-container" style="margin-bottom: 15px;">
                    <label for="musicaAvaliacao" style="display: block; margin-bottom: 5px; font-weight: 500;">Música</label>
                    <input type="text" id="musicaAvaliacao" placeholder="Nome da Música" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="artistaAvaliacao" style="display: block; margin-bottom: 5px; font-weight: 500;">Artista</label>
                    <input type="text" id="artistaAvaliacao" placeholder="Nome do Artista" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="comentarioAvaliacao" style="display: block; margin-bottom: 5px; font-weight: 500;">Comentário</label>
                    <textarea id="comentarioAvaliacao" rows="4" placeholder="Escreva seu comentário..." required></textarea>
                </div>

                <!-- Campo nota: estrelas clicáveis -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 500;">Nota</label>
                    <div class="estrelas-container">
                        <input type="radio" id="star5" name="nota" value="5">
                        <label for="star5" title="5 estrelas">★</label>

                        <input type="radio" id="star4" name="nota" value="4">
                        <label for="star4" title="4 estrelas">★</label>

                        <input type="radio" id="star3" name="nota" value="3">
                        <label for="star3" title="3 estrelas">★</label>

                        <input type="radio" id="star2" name="nota" value="2">
                        <label for="star2" title="2 estrelas">★</label>

                        <input type="radio" id="star1" name="nota" value="1">
                        <label for="star1" title="1 estrela">★</label>
                    </div>
                </div>

                <button type="submit">Enviar Avaliação</button>
            </form>

            <!-- Parágrafo de mensagem de feedback -->
            <p id="mensagemAvaliacao" style="margin-top: 15px; text-align: center;"></p>
        </section>
    </main>
