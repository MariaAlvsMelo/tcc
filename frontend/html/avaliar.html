
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Avaliar | Entre Notas</title>

    <link rel="stylesheet" href="../style.css">

    <script src="../js/configuracoes.js" defer></script>
</head>

<body class="pagina-avaliar">

    <!-- CABEÇALHO -->

    <header class="cabecalho">

        <a href="home.html" class="nav-logo">

            <span>
                <img
                    src="../img/logo.png"
                    alt="Logo Entre Notas"
                    width="55"
                    height="55"
                >
            </span>

            <img
                src="../img/entrenotas.png"
                alt="Entre Notas"
                width="160"
                height="55"
            >

        </a>

        <nav class="cabecalho-menu">

            <a href="home.html" class="nav-item">
                <img
                    src="../img/home-icon.png"
                    alt=""
                    width="20"
                    height="20"
                >
                Feed
            </a>

            <a href="avaliar.html" class="nav-item">
                <img
                    src="../img/avaliar-icon.png"
                    alt=""
                    width="20"
                    height="20"
                >
                Avaliar
            </a>

            <a href="perfil.html" class="nav-item">
                <img
                    src="../img/perfil-icon.png"
                    alt=""
                    width="20"
                    height="20"
                >
                Perfil
            </a>

        </nav>

        <!-- CONFIGURAÇÕES -->

        <a
            href="configuracoes.html"
            class="atalho-config"
            title="Configurações"
            aria-label="Abrir configurações"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="23"
                height="23"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path
                    d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"
                ></path>

                <path
                    d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2 2-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.57V21h-2.83v-.09A1.7 1.7 0 0 0 10.97 19.3a1.7 1.7 0 0 0-1.88.34l-.06.06-2-2 .06-.06A1.7 1.7 0 0 0 7.43 15a1.7 1.7 0 0 0-1.57-1.03H5v-2.83h.86A1.7 1.7 0 0 0 7.43 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2-2 .06.06A1.7 1.7 0 0 0 10.97 6.46a1.7 1.7 0 0 0 1.03-1.57V4h2.83v.89a1.7 1.7 0 0 0 1.03 1.57 1.7 1.7 0 0 0 1.88-.34l.06-.06 2 2-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.57 1.03H21v2.83h-.03A1.7 1.7 0 0 0 19.4 15z"
                ></path>
            </svg>
        </a>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->

    <main id="home-container">

        <section class="card-avaliacao">

            <h2 class="titulo-avaliar">
                Avaliar Música
            </h2>

            <p class="subtitulo-avaliar">
                Compartilhe sua opinião musical
            </p>

            <!-- SEM LOGIN -->

            <section
                id="avaliarSemLogin"
                class="acesso-sem-login"
                style="display: none;"
            >

                <div class="acesso-sem-login-icone">
                    ★
                </div>

                <h2>Quer avaliar uma música?</h2>

                <p>
                    Entre na sua conta para compartilhar sua opinião,
                    dar uma nota e publicar sua avaliação.
                </p>

                <a
                    href="login.html"
                    class="btn-acesso-login"
                >
                    Fazer login
                </a>

            </section>

            <!-- FORMULÁRIO -->

            <form id="formAvaliacao">

                <!-- MÚSICA -->

                <div class="busca-container">

                    <label for="musicaAvaliacao">
                        Música
                    </label>

                    <input
                        type="text"
                        id="musicaAvaliacao"
                        placeholder="Digite o nome da música..."
                        autocomplete="off"
                        required
                    >

                    <div
                        id="listaSugestoesMusica"
                        class="lista-sugestoes"
                    ></div>

                </div>

                <!-- ARTISTA -->

                <div class="busca-container">

                    <label for="artistaAvaliacao">
                        Artista
                    </label>

                    <input
                        type="text"
                        id="artistaAvaliacao"
                        placeholder="Digite o nome do artista..."
                        autocomplete="off"
                        required
                    >

                    <div
                        id="listaSugestoesArtista"
                        class="lista-sugestoes"
                    ></div>

                </div>

                <!-- MÚSICA SELECIONADA -->

                <div
                    id="musicaSelecionada"
                    style="display: none;"
                >

                    <img
                        id="capaAlbum"
                        src=""
                        alt="Capa do álbum"
                    >

                    <p id="tituloMusicaSelecionada"></p>

                    <p id="albumMusicaSelecionada"></p>

                    <!-- PLAYER -->

                    <div
                        id="areaPreviewMusica"
                        class="preview-avaliacao"
                        style="display: none;"
                    >

                        <p class="preview-titulo">
                            Prévia da música
                        </p>

                        <audio
                            id="previewMusica"
                            controls
                            preload="metadata"
                        >
                            Seu navegador não suporta áudio.
                        </audio>

                        <small
                            id="erroPreviewAvaliar"
                            class="erro-preview"
                            hidden
                        >
                            Não foi possível reproduzir esta prévia.
                        </small>

                    </div>

                </div>

                <!-- COMENTÁRIO -->

                <div class="campo-avaliacao">

                    <label for="comentarioAvaliacao">
                        Comentário
                    </label>

                    <textarea
                        id="comentarioAvaliacao"
                        rows="4"
                        placeholder="Escreva seu comentário..."
                        required
                    ></textarea>

                </div>

                <!-- NOTA -->

                <div class="campo-avaliacao">

                    <label>Nota</label>

                    <div class="estrelas-container">

                        <input
                            type="radio"
                            id="star5"
                            name="nota"
                            value="5"
                        >
                        <label
                            for="star5"
                            title="5 estrelas"
                        >★</label>

                        <input
                            type="radio"
                            id="star4"
                            name="nota"
                            value="4"
                        >
                        <label
                            for="star4"
                            title="4 estrelas"
                        >★</label>

                        <input
                            type="radio"
                            id="star3"
                            name="nota"
                            value="3"
                        >
                        <label
                            for="star3"
                            title="3 estrelas"
                        >★</label>

                        <input
                            type="radio"
                            id="star2"
                            name="nota"
                            value="2"
                        >
                        <label
                            for="star2"
                            title="2 estrelas"
                        >★</label>

                        <input
                            type="radio"
                            id="star1"
                            name="nota"
                            value="1"
                        >
                        <label
                            for="star1"
                            title="1 estrela"
                        >★</label>

                    </div>

                </div>

                <!-- ENVIAR -->

                <button type="submit">
                    Enviar Avaliação
                </button>

            </form>

            <p
                id="mensagemAvaliacao"
                style="margin-top: 15px; text-align: center;"
                aria-live="polite"
            ></p>

        </section>

    </main>

    <!-- LOADING -->

    <div
        id="loadingOverlay"
        class="loading-overlay"
    >

        <div class="loading-conteudo">

            <img
                src="../img/logo.png"
                alt="Carregando..."
                class="estrela-giratoria"
            >

            <p>Enviando avaliação...</p>

        </div>

    </div>

    <script src="../js/avaliar.js"></script>

</body>
</html>
