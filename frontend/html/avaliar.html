
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avaliar | Entre Notas</title>

    <link rel="stylesheet" href="../style.css">
    <script src="../js/configuracoes.js"></script>

    <style>
        /* Centralização da página */

        #home-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 100px 20px 40px;
            box-sizing: border-box;
        }

        #home-container > .card-avaliacao {
            width: 100%;
            max-width: 700px;
            min-width: 0;
        }

        /* Campos com sugestões */

        .busca-container {
            position: relative;
            margin-bottom: 15px;
        }

        .lista-sugestoes {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;

            background: #1a1a30;
            border: 1px solid #30304d;
            border-radius: 8px;

            z-index: 1000;

            max-height: 350px;
            overflow-y: auto;

            display: none;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .sugestao-musica {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 10px;
            cursor: pointer;

            transition: background 0.2s ease;
        }

        .sugestao-musica:hover {
            background: #272747;
        }

        .sugestao-musica img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .sugestao-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .sugestao-info strong {
            color: white;
        }

        .sugestao-info span {
            color: #aaa;
            font-size: 0.9rem;
        }

        .sugestao-info strong,
        .sugestao-info span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Música selecionada */

        #musicaSelecionada {
            display: none;
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;

            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            box-sizing: border-box;
        }

        #capaAlbum {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            margin-bottom: 12px;
        }

        #tituloMusicaSelecionada {
            color: var(--purple-light, #9b63ff);
            font-weight: bold;
            font-size: 1.05rem;
            overflow-wrap: anywhere;
        }

        #albumMusicaSelecionada {
            color: #b8b4ca;
            font-size: 0.9rem;
            overflow-wrap: anywhere;
        }

        /* Estrelas */

        .estrelas-container {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 4px;
            margin: 8px 0;
        }

        .estrelas-container input[type="radio"] {
            display: none;
        }

        .estrelas-container label {
            font-size: 2rem;
            color: #ccc;
            cursor: pointer;
            transition: color 0.15s, transform 0.1s;
        }

        .estrelas-container input[type="radio"]:checked ~ label,
        .estrelas-container label:hover,
        .estrelas-container label:hover ~ label {
            color: #f5a623;
            transform: scale(1.15);
        }

        @media (max-width: 600px) {
            .lista-sugestoes {
                max-height: 280px;
            }

            .sugestao-musica img {
                width: 48px;
                height: 48px;
            }

            #capaAlbum {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>

<body>

    <!-- CABEÇALHO -->

    <header class="cabecalho">

        <a href="home.html" class="nav-logo">
            <span>
                <img
                    src="../img/logo.png"
                    alt="Logo Entre Notas"
                    width="55"
                    height="55"
                >
            </span>

            <img
                src="../img/entrenotas.png"
                alt="Entre Notas"
                width="160"
                height="55"
            >
        </a>

        <nav class="cabecalho-menu">

            <a href="home.html" class="nav-item">
                <img src="../img/home-icon.png" alt="" width="20" height="20">
                Feed
            </a>

            <a href="avaliar.html" class="nav-item">
                <img src="../img/avaliar-icon.png" alt="" width="20" height="20">
                Avaliar
            </a>

            <a href="perfil.html" class="nav-item">
                <img src="../img/perfil-icon.png" alt="" width="20" height="20">
                Perfil
            </a>
            
<!-- CONFIGURAÇÕES NO CANTO SUPERIOR DIREITO -->

            <a
            href="configuracoes.html"
            class="atalho-config"
            title="Configurações"
            aria-label="Abrir configurações"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="23"
                height="23"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2 2-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.57V21h-2.83v-.09A1.7 1.7 0 0 0 10.97 19.3a1.7 1.7 0 0 0-1.88.34l-.06.06-2-2 .06-.06A1.7 1.7 0 0 0 7.43 15a1.7 1.7 0 0 0-1.57-1.03H5v-2.83h.86A1.7 1.7 0 0 0 7.43 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2-2 .06.06A1.7 1.7 0 0 0 10.97 6.46 1.7 1.7 0 0 0 12 4.89V4h2.83v.89a1.7 1.7 0 0 0 1.03 1.57 1.7 1.7 0 0 0 1.88-.34l.06-.06 2 2-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.57 1.03H21v2.83h-.03A1.7 1.7 0 0 0 19.4 15z"></path>
            </svg>
        </a>

        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->

    <main id="home-container">

        <section class="card-avaliacao">

            <h2 style="
                color: var(--purple-light, #9b63ff);
                margin-top: 0;
                font-size: 1.5rem;
            ">
                Avaliar Música
            </h2>

            <p style="
                margin-bottom: 20px;
                color: #b8b4ca;
            ">
                Compartilhe sua opinião musical
            </p>

            <!-- MENSAGEM PARA NÃO LOGADOS -->

            <section
                id="avaliarSemLogin"
                class="acesso-sem-login"
                style="display: none;"
            >
                <div class="acesso-sem-login-icone">
                    ★
                </div>

                <h2>Quer avaliar uma música?</h2>

                <p>
                    Entre na sua conta para compartilhar sua opinião,
                    dar uma nota e publicar sua avaliação.
                </p>

                <a href="login.html" class="btn-acesso-login">
                    Fazer login
                </a>
            </section>

            <!-- FORMULÁRIO -->

            <form id="formAvaliacao">

                <!-- MÚSICA -->

                <div class="busca-container">

                    <label for="musicaAvaliacao">
                        Música
                    </label>

                    <input
                        type="text"
                        id="musicaAvaliacao"
                        placeholder="Digite o nome da música..."
                        autocomplete="off"
                        required
                    >

                    <div
                        id="listaSugestoesMusica"
                        class="lista-sugestoes"
                    ></div>

                </div>

                <!-- ARTISTA -->

                <div class="busca-container">

                    <label for="artistaAvaliacao">
                        Artista
                    </label>

                    <input
                        type="text"
                        id="artistaAvaliacao"
                        placeholder="Digite o nome do artista..."
                        autocomplete="off"
                        required
                    >

                    <div
                        id="listaSugestoesArtista"
                        class="lista-sugestoes"
                    ></div>

                </div>

                <!-- MÚSICA SELECIONADA -->

                <div id="musicaSelecionada">

                    <img
                        id="capaAlbum"
                        src=""
                        alt="Capa do álbum"
                    >

                    <p id="tituloMusicaSelecionada"></p>

                    <p id="albumMusicaSelecionada"></p>

                    <!-- PLAYER PADRONIZADO -->

                    <div
                        id="areaPreviewMusica"
                        class="preview-avaliacao"
                        style="display: none;"
                    >
                        <p class="preview-titulo">
                            Prévia da música
                        </p>

                        <audio
                            id="previewMusica"
                            controls
                            preload="metadata"
                        >
                            Seu navegador não suporta áudio.
                        </audio>

                        <small
                            id="erroPreviewAvaliar"
                            class="erro-preview"
                            hidden
                        >
                            Não foi possível reproduzir esta prévia.
                        </small>
                    </div>

                </div>

                <!-- COMENTÁRIO -->

                <div style="margin-bottom: 15px;">

                    <label for="comentarioAvaliacao">
                        Comentário
                    </label>

                    <textarea
                        id="comentarioAvaliacao"
                        rows="4"
                        placeholder="Escreva seu comentário..."
                        required
                    ></textarea>

                </div>

                <!-- NOTA -->

                <div style="margin-bottom: 20px;">

                    <label>Nota</label>

                    <div class="estrelas-container">

                        <input
                            type="radio"
                            id="star5"
                            name="nota"
                            value="5"
                        >
                        <label for="star5" title="5 estrelas">★</label>

                        <input
                            type="radio"
                            id="star4"
                            name="nota"
                            value="4"
                        >
                        <label for="star4" title="4 estrelas">★</label>

                        <input
                            type="radio"
                            id="star3"
                            name="nota"
                            value="3"
                        >
                        <label for="star3" title="3 estrelas">★</label>

                        <input
                            type="radio"
                            id="star2"
                            name="nota"
                            value="2"
                        >
                        <label for="star2" title="2 estrelas">★</label>

                        <input
                            type="radio"
                            id="star1"
                            name="nota"
                            value="1"
                        >
                        <label for="star1" title="1 estrela">★</label>

                    </div>

                </div>

                <!-- ENVIAR -->

                <button type="submit">
                    Enviar Avaliação
                </button>

            </form>

            <p
                id="mensagemAvaliacao"
                style="margin-top: 15px; text-align: center;"
                aria-live="polite"
            ></p>

        </section>

    </main>

    <!-- LOADING -->

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-conteudo">

            <img
                src="../img/logo.png"
                alt="Carregando..."
                class="estrela-giratoria"
            >

            <p>Enviando avaliação...</p>

        </div>
    </div>

    <script src="../js/avaliar.js"></script>

</body>
</html>
