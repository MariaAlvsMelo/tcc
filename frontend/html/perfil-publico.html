
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil público | Entre Notas</title>

    <link rel="stylesheet" href="../style.css">

    <script src="../js/configuracoes.js" defer></script>
    <script src="../js/perfil-publico.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <a href="home.html" class="nav-logo">
          <span>
            <img src="../img/logo.png" alt="Entre Notas" width="55" height="55" >
        </span>
          <img src="../img/entrenotas.png" alt="Entre Notas" width="160" height="55" ></a>
        <nav class="cabecalho-menu">
          <a href="home.html" class="nav-item">
            <img src="../img/home-icon.png" alt="Feed" width="20" height="20">
            Feed
          </a>
          <a href="avaliar.html" class="nav-item">
            <img src="../img/avaliar-icon.png" alt="Avaliar" width="20" height="20">
            Avaliar
          </a>
          <a href="perfil.html" class="nav-item">
            <img src="../img/perfil-icon.png" alt="Perfil" width="20" height="20">
            Perfil
          </a>
          <a

        <!-- CONFIGURAÇÕES -->

        <a
            href="configuracoes.html"
            class="atalho-config"
            title="Configurações"
            aria-label="Abrir configurações"
        >
            ⚙
        </a>

    </header>

    <!-- CONTEÚDO -->

    <main class="pagina-perfil-publico">

        <!-- VOLTAR -->

        <a
            href="home.html"
            class="voltar-perfil-publico"
        >
            ← Voltar ao Feed
        </a>

        <!-- CARREGAMENTO -->

        <p
            id="mensagemPerfilPublico"
            role="status"
            aria-live="polite"
        >
            Carregando perfil...
        </p>

        <!-- INFORMAÇÕES DO PERFIL -->

        <section
            id="cabecalhoPerfilPublico"
            class="perfil-publico-topo"
            hidden
        >

            <img
                id="fotoPerfilPublico"
                src="../img/logo.png"
                alt="Foto do usuário"
                class="perfil-publico-foto"
            >

            <div class="perfil-publico-info">

                <span class="perfil-publico-etiqueta">
                    Perfil público
                </span>

                <h1 id="nomePerfilPublico"></h1>

                <p id="biografiaPerfilPublico"></p>

                <span
                    id="totalAvaliacoesPublicas"
                    class="perfil-publico-total"
                ></span>

            </div>

        </section>

        <!-- AVALIAÇÕES -->

        <section
            id="secaoAvaliacoesPublicas"
            class="perfil-publico-secao"
            hidden
        >

            <h2>Avaliações publicadas</h2>

            <div
                id="listaAvaliacoesPublicas"
                class="perfil-publico-lista"
            ></div>

        </section>

    </main>

</body>
</html>
