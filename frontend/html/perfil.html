<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - Entre Notas</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >
<script src="../js/configuracoes.js"></script>
</head>


<body>


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="cabecalho">

        <a href="home.html" class="nav-logo">
      <span>
        <img src="../img/logo.png" alt="Entre Notas" width="55" height="55" >
    </span>
      <img src="../img/entrenotas.png" alt="Entre Notas" width="160" height="55" ></a>
    <nav class="cabecalho-menu">
      <a href="home.html" class="nav-item">
        <img src="../img/home-icon.png" alt="Feed" width="20" height="20">
        Feed
      </a>
      <a href="avaliar.html" class="nav-item">
        <img src="../img/avaliar-icon.png" alt="Avaliar" width="20" height="20">
        Avaliar
      </a>
      <a href="perfil.html" class="nav-item">
        <img src="../img/perfil-icon.png" alt="Perfil" width="20" height="20">
        Perfil
      </a>

         
            <a
                href="login.html"
                id="btnLoginCabecalho"
                class="btn-login-cabecalho"
                style="display: none;"
            >
                Login
            </a>
            
<!-- CONFIGURAÇÕES NO CANTO SUPERIOR DIREITO -->

            <a
                href="configuracoes.html"
                class="atalho-config"
                title="Configurações"
                aria-label="Abrir configurações"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="23"
                    height="23"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2 2-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.57V21h-2.83v-.09A1.7 1.7 0 0 0 10.97 19.3a1.7 1.7 0 0 0-1.88.34l-.06.06-2-2 .06-.06A1.7 1.7 0 0 0 7.43 15a1.7 1.7 0 0 0-1.57-1.03H5v-2.83h.86A1.7 1.7 0 0 0 7.43 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2-2 .06.06A1.7 1.7 0 0 0 10.97 6.46 1.7 1.7 0 0 0 12 4.89V4h2.83v.89a1.7 1.7 0 0 0 1.03 1.57 1.7 1.7 0 0 0 1.88-.34l.06-.06 2 2-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.57 1.03H21v2.83h-.03A1.7 1.7 0 0 0 19.4 15z"></path>
                </svg>
            </a>

        </nav>

    </header>

    <section
        id="perfilSemLogin"
        class="acesso-sem-login"
        style="display: none;"
    >

        <div class="acesso-sem-login-icone">
        <img src="../img/perfil-icon.png" alt="Perfil" width="20" height="20">
        </div>


        <h2>
            Seu perfil começa aqui
        </h2>


        <p>
            Faça login para acessar seu perfil,
            editar suas informações e visualizar
            todas as suas avaliações.
        </p>


        <a
            href="login.html"
            class="btn-acesso-login"
        >
            Fazer login
        </a>

    </section>



    <!-- =====================================================
         PERFIL NORMAL

         MODIFICADO:
         Começa escondido.
         O perfil.js mostra somente se existir usuário logado.
    ====================================================== -->

    <main
        id="perfil-container"
        class="perfil-container"
        style="display: none;"
    >


        <!-- =================================================
             CARD DO PERFIL
        ================================================== -->

        <section class="perfil-card">


            <div class="perfil-topo">


                <!-- =================================================
                     FOTO
                ================================================== -->

                <div class="perfil-foto-area">

                    <img
                        id="fotoPerfil"
                        class="perfil-foto"
                        src="../img/logo.png"
                        alt="Foto de perfil"
                    >


                    <!-- =================================================
                         ALTERAR FOTO
                    ================================================== -->

                    <label
                        for="inputFoto"
                        id="botaoAlterarFoto"
                        class="botao-foto"
                        style="display: none;"
                    >
                         Alterar foto
                    </label>


                    <input
                        type="file"
                        id="inputFoto"
                        accept="image/*"
                        hidden
                    >

                </div>



                <!-- =================================================
                     INFORMAÇÕES DO PERFIL
                ================================================== -->

                <div class="perfil-resumo">

                    <h1 id="nomePerfil">
                        Carregando...
                    </h1>


                    <p id="emailPerfil">
                    </p>


                    <p
                        id="biografiaPerfil"
                        class="perfil-biografia"
                    >
                        Adicione uma biografia ao seu perfil.
                    </p>



                    <!-- =================================================
                         EDITAR PERFIL
                    ================================================== -->

                    <button
                        type="button"
                        id="btnEditarPerfil"
                        class="botao-editar-perfil"
                    >
                         Editar perfil
                    </button>



                    <!-- =================================================
                         SAIR DA CONTA
                    ================================================== -->

                    <button
                        type="button"
                        id="btnSairConta"
                        class="botao-sair-conta"
                    >
                        Sair da conta
                    </button>

                </div>

            </div>



            <!-- =================================================
                 ÁREA DE EDIÇÃO
            ================================================== -->

            <section
                id="areaEdicaoPerfil"
                class="perfil-edicao"
                style="display: none;"
            >

                <div class="perfil-separador">
                </div>


                <h2>
                    Editar perfil
                </h2>


                <form id="formPerfil">


                    <!-- NOME -->

                    <label
                        for="nomePerfilInput"
                    >
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nomePerfilInput"
                        required
                    >



                    <!-- E-MAIL -->

                    <label
                        for="emailPerfilInput"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailPerfilInput"
                        required
                    >



                    <!-- SENHA -->

                    <label
                        for="senhaPerfilInput"
                    >
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="senhaPerfilInput"
                        placeholder="Deixe vazio para manter a senha atual"
                    >



                    <!-- BIOGRAFIA -->

                    <label
                        for="biografiaInput"
                    >
                        Biografia
                    </label>

                    <textarea
                        id="biografiaInput"
                        rows="4"
                        maxlength="500"
                        placeholder="Conte um pouco sobre você..."
                    ></textarea>



                    <!-- BOTÕES -->

                    <div class="botoes-edicao-perfil">

                        <button
                            type="submit"
                            class="botao-perfil"
                        >
                            Salvar alterações
                        </button>


                        <button
                            type="button"
                            id="btnCancelarEdicao"
                            class="botao-cancelar-perfil"
                        >
                            Cancelar
                        </button>

                    </div>


                    <p
                        id="mensagemPerfil"
                        class="mensagem-alerta"
                    >
                    </p>

                </form>

            </section>

        </section>



        <!-- =====================================================
             MINHAS AVALIAÇÕES
        ====================================================== -->

        <section class="minhas-avaliacoes">

            <div class="titulo-minhas-avaliacoes">

                <h2>
                    Minhas avaliações
                </h2>


                <span id="contadorAvaliacoes">
                    0 avaliações
                </span>

            </div>


            <div
                id="listaMinhasAvaliacoes"
            >
            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js/perfil.js"></script>


</body>

</html>
