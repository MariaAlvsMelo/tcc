<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - Entre Notas</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="cabecalho">

        <a
            href="home.html"
            class="nav-logo"
        >

            <span>

                <img
                    src="../img/logo.png"
                    alt="Entre Notas"
                    width="55"
                    height="55"
                >

            </span>

            Entre Notas

        </a>


        <nav class="cabecalho-menu">

            <a
                href="home.html"
                class="nav-item"
            >
                <span class="icon">🏠</span>
                Feed
            </a>


            <a
                href="avaliar.html"
                class="nav-item"
            >
                <span class="icon">⭐</span>
                Avaliar
            </a>


            <a
                href="perfil.html"
                class="nav-item active"
            >
                <span class="icon">👤</span>
                Perfil
            </a>


            <!-- =================================================
                 ADICIONADO:
                 LOGIN APARECE SOMENTE QUANDO NÃO ESTIVER LOGADO
            ================================================== -->

            <a
                href="login.html"
                id="btnLoginCabecalho"
                class="btn-login-cabecalho"
                style="display: none;"
            >
                Login
            </a>

        </nav>

    </header>



    <!-- =====================================================
         ADICIONADO:
         INTERFACE EXCLUSIVA PARA QUEM NÃO ESTÁ LOGADO
    ====================================================== -->

    <section
        id="perfilSemLogin"
        class="acesso-sem-login"
        style="display: none;"
    >

        <div class="acesso-sem-login-icone">
            ♫
        </div>


        <h2>
            Seu perfil começa aqui
        </h2>


        <p>
            Faça login para acessar seu perfil,
            editar suas informações e visualizar
            todas as suas avaliações.
        </p>


        <a
            href="login.html"
            class="btn-acesso-login"
        >
            Fazer login
        </a>

    </section>



    <!-- =====================================================
         PERFIL NORMAL

         MODIFICADO:
         Começa escondido.
         O perfil.js mostra somente se existir usuário logado.
    ====================================================== -->

    <main
        id="perfil-container"
        class="perfil-container"
        style="display: none;"
    >


        <!-- =================================================
             CARD DO PERFIL
        ================================================== -->

        <section class="perfil-card">


            <div class="perfil-topo">


                <!-- =================================================
                     FOTO
                ================================================== -->

                <div class="perfil-foto-area">

                    <img
                        id="fotoPerfil"
                        class="perfil-foto"
                        src="../img/logo.png"
                        alt="Foto de perfil"
                    >


                    <!-- =================================================
                         ALTERAR FOTO
                    ================================================== -->

                    <label
                        for="inputFoto"
                        id="botaoAlterarFoto"
                        class="botao-foto"
                        style="display: none;"
                    >
                        📷 Alterar foto
                    </label>


                    <input
                        type="file"
                        id="inputFoto"
                        accept="image/*"
                        hidden
                    >

                </div>



                <!-- =================================================
                     INFORMAÇÕES DO PERFIL
                ================================================== -->

                <div class="perfil-resumo">

                    <h1 id="nomePerfil">
                        Carregando...
                    </h1>


                    <p id="emailPerfil">
                    </p>


                    <p
                        id="biografiaPerfil"
                        class="perfil-biografia"
                    >
                        Adicione uma biografia ao seu perfil.
                    </p>



                    <!-- =================================================
                         EDITAR PERFIL
                    ================================================== -->

                    <button
                        type="button"
                        id="btnEditarPerfil"
                        class="botao-editar-perfil"
                    >
                        ✏️ Editar perfil
                    </button>



                    <!-- =================================================
                         SAIR DA CONTA
                    ================================================== -->

                    <button
                        type="button"
                        id="btnSairConta"
                        class="botao-sair-conta"
                    >
                        Sair da conta
                    </button>

                </div>

            </div>



            <!-- =================================================
                 ÁREA DE EDIÇÃO
            ================================================== -->

            <section
                id="areaEdicaoPerfil"
                class="perfil-edicao"
                style="display: none;"
            >

                <div class="perfil-separador">
                </div>


                <h2>
                    Editar perfil
                </h2>


                <form id="formPerfil">


                    <!-- NOME -->

                    <label
                        for="nomePerfilInput"
                    >
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nomePerfilInput"
                        required
                    >



                    <!-- E-MAIL -->

                    <label
                        for="emailPerfilInput"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailPerfilInput"
                        required
                    >



                    <!-- SENHA -->

                    <label
                        for="senhaPerfilInput"
                    >
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="senhaPerfilInput"
                        placeholder="Deixe vazio para manter a senha atual"
                    >



                    <!-- BIOGRAFIA -->

                    <label
                        for="biografiaInput"
                    >
                        Biografia
                    </label>

                    <textarea
                        id="biografiaInput"
                        rows="4"
                        maxlength="500"
                        placeholder="Conte um pouco sobre você..."
                    ></textarea>



                    <!-- BOTÕES -->

                    <div class="botoes-edicao-perfil">

                        <button
                            type="submit"
                            class="botao-perfil"
                        >
                            Salvar alterações
                        </button>


                        <button
                            type="button"
                            id="btnCancelarEdicao"
                            class="botao-cancelar-perfil"
                        >
                            Cancelar
                        </button>

                    </div>


                    <p
                        id="mensagemPerfil"
                        class="mensagem-alerta"
                    >
                    </p>

                </form>

            </section>

        </section>



        <!-- =====================================================
             MINHAS AVALIAÇÕES
        ====================================================== -->

        <section class="minhas-avaliacoes">

            <div class="titulo-minhas-avaliacoes">

                <h2>
                    Minhas avaliações
                </h2>


                <span id="contadorAvaliacoes">
                    0 avaliações
                </span>

            </div>


            <div
                id="listaMinhasAvaliacoes"
            >
            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js/perfil.js"></script>


</body>

</html>
