name: Deploy GitHub Pages

on:
  push:
    branches:
      - main  # Altere para master se a sua branch principal for master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Renomeia home.html para index.html antes do deploy para o GitHub Pages reconhecer
      - name: Ajustar pagina inicial
        run: cp frontend/html/home.html frontend/html/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Define a pasta exata que será enviada para o site
          path: 'frontend/html/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4