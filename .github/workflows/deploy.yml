name: Deploy GitHub Pages

on:
  push:
    branches:
      - main  # Altere para master se a sua branch principal for master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Como o GitHub Pages exige um arquivo index.html na raiz do site,
      # criamos uma cópia do seu home.html diretamente na raiz da pasta frontend.
      - name: Criar index na raiz do frontend
        run: cp frontend/html/home.html frontend/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Envia a pasta frontend inteira com todas as subpastas (html, img, js e o style.css)
          path: 'frontend/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
